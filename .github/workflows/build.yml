name: EAS Build — AAB + APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.2)"
        required: true
        default: "1.0.0"

jobs:
  build_aab:
    name: Build AAB (Play Store)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Lance le build AAB
        id: launch
        run: |
          # Sauvegarder stdout ET stderr séparément
          eas build --platform android --profile production --non-interactive --json --no-wait > eas_output.txt 2>eas_stderr.txt || true
          echo "=== STDOUT ===" && cat eas_output.txt
          echo "=== STDERR ===" && cat eas_stderr.txt
          # Extraire le JSON (dernière ligne qui ressemble à du JSON)
          JSON_LINE=$(grep -o '\[.*\]\|\{.*\}' eas_output.txt | tail -1)
          echo "JSON extrait: $JSON_LINE"
          BUILD_ID=$(echo "$JSON_LINE" | jq -r '.[0].id // .id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Attendre et télécharger le AAB
        run: |
          BUILD_ID="${{ steps.launch.outputs.build_id }}"
          echo "Build ID: $BUILD_ID"
          for i in $(seq 1 40); do
            eas build:view "$BUILD_ID" --json > view_output.txt 2>/dev/null || true
            STATUS=$(grep -o '"status":"[^"]*"' view_output.txt | head -1 | cut -d'"' -f4)
            echo "Statut ($i/40): $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              URL=$(grep -o '"buildUrl":"[^"]*"' view_output.txt | head -1 | cut -d'"' -f4)
              curl -L "$URL" -o build.aab
              echo "✅ AAB téléchargé"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build échoué: $STATUS"
              exit 1
            fi
            sleep 60
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: build-aab
          path: build.aab

  build_apk:
    name: Build APK (sideload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Lance le build APK
        id: launch
        run: |
          eas build --platform android --profile preview --non-interactive --json --no-wait > eas_output.txt 2>eas_stderr.txt || true
          echo "=== STDOUT ===" && cat eas_output.txt
          echo "=== STDERR ===" && cat eas_stderr.txt
          JSON_LINE=$(grep -o '\[.*\]\|\{.*\}' eas_output.txt | tail -1)
          echo "JSON extrait: $JSON_LINE"
          BUILD_ID=$(echo "$JSON_LINE" | jq -r '.[0].id // .id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Attendre et télécharger le APK
        run: |
          BUILD_ID="${{ steps.launch.outputs.build_id }}"
          echo "Build ID: $BUILD_ID"
          for i in $(seq 1 40); do
            eas build:view "$BUILD_ID" --json > view_output.txt 2>/dev/null || true
            STATUS=$(grep -o '"status":"[^"]*"' view_output.txt | head -1 | cut -d'"' -f4)
            echo "Statut ($i/40): $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              URL=$(grep -o '"buildUrl":"[^"]*"' view_output.txt | head -1 | cut -d'"' -f4)
              curl -L "$URL" -o build.apk
              echo "✅ APK téléchargé"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build échoué: $STATUS"
              exit 1
            fi
            sleep 60
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: build.apk

  release:
    name: Créer la Release GitHub
    runs-on: ubuntu-latest
    needs: [build_aab, build_apk]
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: build-aab

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: build-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: "v${{ github.event.inputs.version }}"
          body: |
            ## 📦 Emploi du Temps — v${{ github.event.inputs.version }}

            ### Fichiers
            - `build.aab` → upload sur Google Play Console
            - `build.apk` → installation directe (test / sideload)

            > Build généré automatiquement via EAS Build (Expo)
          files: |
            build.aab
            build.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
