name: EAS Build - AAB + APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.2)"
        required: true
        default: "1.0.0"

jobs:
  build_aab:
    name: Build AAB (Play Store)
    runs-on: ubuntu-latest
    outputs:
      download_url: ${{ steps.wait.outputs.download_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Lance le build AAB
        id: launch
        run: |
          OUTPUT=$(eas build --platform android --profile production --non-interactive --json --no-wait 2>/dev/null)
          echo "raw: $OUTPUT"
          BUILD_ID=$(echo "$OUTPUT" | jq -r '.[0].id // .id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Attendre et télécharger le AAB
        id: wait
        run: |
          BUILD_ID="${{ steps.launch.outputs.build_id }}"
          echo "Build ID: $BUILD_ID"
          for i in $(seq 1 40); do
            STATUS=$(eas build:view "$BUILD_ID" --json 2>/dev/null | jq -r '.status')
            echo "Statut ($i/40): $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              URL=$(eas build:view "$BUILD_ID" --json 2>/dev/null | jq -r '.artifacts.buildUrl')
              echo "download_url=$URL" >> $GITHUB_OUTPUT
              curl -L "$URL" -o build.aab
              echo "✅ AAB téléchargé"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build échoué: $STATUS"
              exit 1
            fi
            sleep 60
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload AAB comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: build-aab
          path: build.aab

  build_apk:
    name: Build APK (sideload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Lance le build APK
        id: launch
        run: |
          OUTPUT=$(eas build --platform android --profile preview --non-interactive --json --no-wait 2>/dev/null)
          echo "raw: $OUTPUT"
          BUILD_ID=$(echo "$OUTPUT" | jq -r '.[0].id // .id')
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Attendre et télécharger le APK
        run: |
          BUILD_ID="${{ steps.launch.outputs.build_id }}"
          echo "Build ID: $BUILD_ID"
          for i in $(seq 1 40); do
            STATUS=$(eas build:view "$BUILD_ID" --json 2>/dev/null | jq -r '.status')
            echo "Statut ($i/40): $STATUS"
            if [ "$STATUS" = "FINISHED" ]; then
              URL=$(eas build:view "$BUILD_ID" --json 2>/dev/null | jq -r '.artifacts.buildUrl')
              curl -L "$URL" -o build.apk
              echo "✅ APK téléchargé"
              break
            elif [ "$STATUS" = "ERRORED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build échoué: $STATUS"
              exit 1
            fi
            sleep 60
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: build.apk

  release:
    name: Créer la Release GitHub
    runs-on: ubuntu-latest
    needs: [build_aab, build_apk]
    steps:
      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: build-aab

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: build-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: "v${{ github.event.inputs.version }}"
          body: |
            ## 📦 Emploi du Temps — v${{ github.event.inputs.version }}

            ### Fichiers
            - `build.aab` → upload sur Google Play Console
            - `build.apk` → installation directe (test / sideload)

            > Build généré automatiquement via EAS Build (Expo)
          files: |
            build.aab
            build.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
