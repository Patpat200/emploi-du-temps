name: EAS Build - AAB + APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex: 1.0.2)"
        required: true
        default: "1.0.0"

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      # ── Build AAB (Play Store) ──────────────────────────────────────
      - name: Build AAB (production)
        id: build_aab
        run: |
          BUILD_URL=$(eas build --platform android --profile production --non-interactive --json --no-wait | jq -r '.[0].buildUrl // .buildUrl // empty')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── Build APK (sideload / test) ─────────────────────────────────
      - name: Build APK (preview)
        id: build_apk
        run: |
          BUILD_URL=$(eas build --platform android --profile preview --non-interactive --json --no-wait | jq -r '.[0].buildUrl // .buildUrl // empty')
          echo "build_url=$BUILD_URL" >> $GITHUB_OUTPUT
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── Attendre la fin des builds et récupérer les artefacts ───────
      - name: Wait and download AAB
        run: |
          echo "En attente du build AAB..."
          eas build:list --platform android --status finished --limit 1 --json > /dev/null 2>&1 || true
          # Attendre que le build soit terminé puis télécharger
          for i in $(seq 1 30); do
            DOWNLOAD_URL=$(eas build:list --platform android --status finished --limit 1 --json | jq -r '.[0].artifacts.buildUrl // empty')
            if [ -n "$DOWNLOAD_URL" ]; then
              curl -L "$DOWNLOAD_URL" -o build.aab
              echo "AAB téléchargé ✅"
              break
            fi
            echo "Attente... ($i/30)"
            sleep 60
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait and download APK
        run: |
          echo "En attente du build APK..."
          for i in $(seq 1 30); do
            DOWNLOAD_URL=$(eas build:list --platform android --profile preview --status finished --limit 1 --json | jq -r '.[0].artifacts.buildUrl // empty')
            if [ -n "$DOWNLOAD_URL" ]; then
              curl -L "$DOWNLOAD_URL" -o build.apk
              echo "APK téléchargé ✅"
              break
            fi
            echo "Attente... ($i/30)"
            sleep 60
          done
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      # ── Créer la release GitHub ─────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: "v${{ github.event.inputs.version }}"
          body: |
            ## 📦 Emploi du Temps — v${{ github.event.inputs.version }}

            ### Fichiers
            - `build.aab` → upload sur Google Play Console
            - `build.apk` → installation directe (test / sideload)

            > Build généré automatiquement via EAS Build (Expo)
          files: |
            build.aab
            build.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
